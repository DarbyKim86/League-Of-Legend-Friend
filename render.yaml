services:
  - type: web
    name: lol-roster
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: RIOT_API_KEY
        sync: false   # 라이엇 API 키
      - key: DATABASE_URL
        sync: false   # Supabase Postgres 연결 문자열 (끝에 ?sslmode=require 권장)
      - key: ADMIN_PASSWORD
        sync: false   # 관리자 비밀번호 (직접 정함)
      - key: SECRET_KEY
        sync: false   # 세션 서명용 아무 랜덤 문자열
